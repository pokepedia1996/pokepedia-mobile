name: pokepedia_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  lottie: ^3.3.1
  supabase_flutter: ^2.16.0
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.1
  # Renders the QRIS payload as a scannable code, on-device.
  qr_flutter: ^4.1.0
  webview_flutter: ^4.10.0
  image_picker: ^1.2.3
  # Live camera feed for the card scanner. image_picker can only hand back a
  # finished still from the OS camera UI — the scanner needs the running
  # preview (guide-box framing, torch, repeated capture without leaving the
  # screen), which only this exposes.
  camera: ^0.11.0+2
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  image: ^4.9.2
  onnxruntime: ^1.4.1
  audioplayers: ^6.8.1
  lucide_icons_flutter: ^3.1.17
  # OS notifications raised by the app itself. The server's push pipeline is
  # Web Push (VAPID), which only browsers can receive, so a new row in
  # `notifications` reaches the app over Realtime and is shown from here.
  flutter_local_notifications: ^19.4.2
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
dev_dependencies:
  # Generate the launcher icon and the splash from `branding/`, which
  # `tool/generate_branding.dart` derives from the website's own artwork.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  rename_app: ^1.6.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/models/
    - assets/sounds/
    - assets/images/
    - assets/images/elements/
    - assets/images/flags/
    - assets/images/social/
    - assets/animation/
    - assets/data/
    - assets/tutorials/
    - assets/legal/

  fonts:
    - family: CalSans
      fonts:
        - asset: assets/fonts/CalSans-Regular.ttf

# Launcher icon. iOS and older Android take one opaque square; Android's
# adaptive icon takes the mark alone over the brand cream, so a round mask
# crops the tile's pattern rather than the mark.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "branding/app-icon.png"
  # iOS renders alpha as black, so the tile's rounded corners are filled with
  # the cream they sit on and the platform masks its own corners over it.
  remove_alpha_ios: true
  background_color_ios: "#F9F5E8"
  adaptive_icon_background: "#F9F5E8"
  adaptive_icon_foreground: "branding/app-icon-foreground.png"
  # The generator insets the foreground 16% by default; the source is already
  # padded to the safe zone, and both insets together shrink the mark to a
  # speck.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

# Splash. The colours are the app's own scaffold backgrounds, so the first
# frame paints over the launch screen without a flash of a different shade.
flutter_native_splash:
  color: "#FCFAF6"
  color_dark: "#211D1F"
  image: "branding/splash-mark.png"
  image_dark: "branding/splash-mark.png"
  android: true
  ios: true
  web: false
  android_12:
    image: "branding/splash-icon-android12.png"
    icon_background_color: "#FCFAF6"
    image_dark: "branding/splash-icon-android12.png"
    icon_background_color_dark: "#211D1F"
